<!doctype html>
<html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fructus · Frutas</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 20px; background: #F7F5EE; color: #17251D; font: 600 15px/1.4 Manrope, system-ui; }
  h1 { font-size: 26px; margin: 0 0 4px; } p { margin: 0 0 16px; color: #56625A; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .f { background: #FFFEFA; border: 1px solid #E4E1D4; border-radius: 20px; padding: 14px; }
  .f h2 { font-size: 16px; margin: 0 0 8px; }
  .fila { display: flex; align-items: flex-end; gap: 14px; }
  .fila img { filter: drop-shadow(0 2px 3px rgb(0 0 0 / .14)); }
  .lista { margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: #F7F5EE; }
</style></head><body>
<h1>Frutas de Fructus</h1>
<p>Cada fruta grande (160 px), como en la app (48 y 40 px) y en una fila de la lista.</p>
<div class="grilla" id="g"></div>
<script>
  const frutas = [["mango-kent","Mango Kent"],["mango-edward","Mango Edward"],["platano-seda","Plátano de seda"],["platano-isla","Plátano de isla"],["papaya","Papaya"],["pina","Piña golden"],["mandarina","Mandarina"],["uva","Uva red globe"],["palta","Palta fuerte"],["limon","Limón"]];
  document.getElementById("g").innerHTML = frutas.map(([a, n]) => `<section class="f"><h2>${n}</h2><div class="fila"><img src="${a}.svg" width="120" alt=""><img src="${a}.svg" width="48" alt=""><img src="${a}.svg" width="40" alt=""></div>
    <div class="lista"><img src="${a}.svg" width="36" alt=""><b>${n}</b></div></section>`).join("");
</script></body></html>
